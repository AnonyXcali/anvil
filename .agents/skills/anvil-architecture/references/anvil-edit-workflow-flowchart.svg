<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1420" viewBox="0 0 1400 1420" role="img" aria-labelledby="title desc">
  <title id="title">Anvil staged edit workflow</title>
  <desc id="desc">Flowchart showing the search, approval, staging, create or existing-file branch, verification, validation, commit, and cleanup steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 3; }
      .branch { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 600 16px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1400" height="1280" fill="#f1f5f9"/>
  <text x="700" y="48" class="label" style="font-size: 28px;">Anvil Staged Edit Workflow</text>
  <text x="700" y="78" class="small">New files are created locally, then created and uploaded remotely during commit.</text>

  <g filter="url(#shadow)">
    <rect x="470" y="110" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="148" class="label">anvil-agent-workflow-search-step</text>

    <rect x="470" y="220" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="258" class="label">anvil-agent-workflow-plan-step</text>

    <rect x="535" y="330" width="330" height="62" rx="14" class="decision"/>
    <text x="700" y="368" class="label">Approval</text>

    <rect x="470" y="440" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="478" class="label">anvil-agent-workflow-edit-input-</text>
    <text x="700" y="498" class="label">compression</text>

    <rect x="470" y="550" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="588" class="label">anvil-agent-workflow-edit-step</text>

    <rect x="470" y="660" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="698" class="label">anvil-agent-staging-prepare-all-files-step</text>

    <polygon points="700,770 820,830 700,890 580,830" class="decision"/>
    <text x="700" y="836" class="label">operation?</text>

    <rect x="80" y="950" width="470" height="78" rx="14" class="branch"/>
    <text x="315" y="982" class="label">anvil-edit-agent-staged-create-</text>
    <text x="315" y="1005" class="label">file-branch-step</text>

    <rect x="850" y="950" width="470" height="78" rx="14" class="branch"/>
    <text x="1085" y="982" class="label">anvil-edit-agent-staged-existing-</text>
    <text x="1085" y="1005" class="label">file-branch-step</text>

    <rect x="470" y="1060" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="1098" class="label">anvil-edit-agent-nested-workflow-</text>
    <text x="700" y="1118" class="label">apply-edit-file-step</text>

    <rect x="470" y="1170" width="460" height="62" rx="14" class="step"/>
    <text x="700" y="1208" class="label">anvil-edit-agent-nested-workflow-</text>
    <text x="700" y="1228" class="label">verify-edit-file-step</text>
  </g>

  <path d="M700 172 V220" class="edge"/>
  <path d="M700 282 V330" class="edge"/>
  <path d="M700 392 V440" class="edge"/>
  <path d="M700 502 V550" class="edge"/>
  <path d="M700 612 V660" class="edge"/>
  <path d="M700 722 V770" class="edge"/>
  <path d="M580 830 H315 V950" class="edge"/>
  <path d="M820 830 H1085 V950" class="edge"/>
  <path d="M315 1028 V1040 H700 V1060" class="edge"/>
  <path d="M1085 1028 V1040 H700 V1060" class="edge"/>
  <path d="M700 1122 V1170" class="edge"/>

  <text x="350" y="814" class="edge-label">create</text>
  <text x="1000" y="814" class="edge-label">edit / delete</text>

  <g filter="url(#shadow)">
    <rect x="20" y="1040" width="400" height="104" rx="14" class="note"/>
    <text x="265" y="1080" class="label">Create path</text>
    <text x="265" y="1106" class="small">Complete content already exists locally.</text>
    <text x="265" y="1128" class="small">No download, patch, or range edit.</text>

    <rect x="980" y="1040" width="400" height="104" rx="14" class="note"/>
    <text x="1135" y="1080" class="label">Existing-file path</text>
    <text x="1135" y="1106" class="small">Download, backup, then apply</text>
    <text x="1135" y="1128" class="small">range, patch, replacement, or delete.</text>
  </g>

  <rect x="60" y="1320" width="1280" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="1350" class="label">After verification: project validation → commit → cleanup</text>
  <text x="700" y="1374" class="small">Remote directories and files are created or changed only during commit.</text>
</svg>
